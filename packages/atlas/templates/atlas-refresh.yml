# This prepares a commit a person then merges. It pushes atlas-refresh and
# never the default branch. Until that commit is merged, the committed map
# is as old as the last merge.
name: Atlas refresh

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: atlas-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.3 (node24 runtime)
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Map and publish the refresh branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          COMPARE: ${{ github.server_url }}/${{ github.repository }}/compare/main...atlas-refresh
        run: |
          set -euo pipefail
          git fetch origin atlas-refresh || true
          args=(--divergence "${RUNNER_TEMP}/divergence.json")
          if git cat-file -e origin/atlas-refresh:atlas/divergence.json 2>/dev/null; then
            git show origin/atlas-refresh:atlas/divergence.json > "${RUNNER_TEMP}/previous.json"
            args+=(--previous "${RUNNER_TEMP}/previous.json")
          fi
          npx --yes @dogfood-lab/atlas map "${args[@]}"
          mkdir -p atlas
          cp "${RUNNER_TEMP}/divergence.json" atlas/divergence.json
          git checkout -B atlas-refresh
          git add -- atlas
          if git diff --cached --quiet; then
            echo "no map change"
          else
            git -c user.name=mcp-tool-shop -c user.email=64996768+mcp-tool-shop@users.noreply.github.com commit -m "atlas: refresh $(date -u +%F)"
            if git rev-parse --verify --quiet origin/atlas-refresh >/dev/null; then
              git push --force-with-lease origin HEAD:atlas-refresh
            else
              git push origin HEAD:atlas-refresh
            fi
          fi
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const current = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/divergence.json', 'utf8'));
          let previous = { rows: [] };
          try { previous = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/previous.json', 'utf8')); } catch {}
          const ids = (doc) => new Set((doc.rows ?? []).filter((row) => row.state === 'open').map((row) => row.id));
          const before = ids(previous);
          const after = ids(current);
          let changed = before.size !== after.size;
          for (const id of after) if (!before.has(id)) changed = true;
          if (!changed) process.exit(0);
          const line = (row) => {
            if (row.rule === 'two-may-be-one') return `${row.rule} ${(row.boundaries ?? []).join(' · ')}`;
            if (row.rule === 'file-moved') return `${row.rule} ${row.boundary} ${row.file} → ${row.partner_boundary}`;
            return `${row.rule} ${row.boundary ?? ''}`.trim();
          };
          const opened = (current.rows ?? []).filter((row) => row.state === 'open' && !before.has(row.id)).map(line);
          const cleared = (previous.rows ?? []).filter((row) => row.state === 'open' && !after.has(row.id)).map(line);
          const body = ['Compare: ' + process.env.COMPARE, '', 'opened:', ...opened, 'cleared:', ...cleared].join('\n');
          const title = 'atlas: divergence changed ' + new Date().toISOString().slice(0, 10);
          const { spawnSync } = await import('node:child_process');
          const list = spawnSync('gh', ['issue', 'list', '--state', 'open', '--limit', '20', '--json', 'number,title'], { encoding: 'utf8' });
          if (list.status !== 0) process.exit(list.status ?? 1);
          const issues = JSON.parse(list.stdout || '[]');
          const existing = issues.find((issue) => String(issue.title).startsWith('atlas: divergence changed'));
          const result = existing
            ? spawnSync('gh', ['issue', 'comment', String(existing.number), '--body', body], { stdio: 'inherit' })
            : spawnSync('gh', ['issue', 'create', '--title', title, '--body', body], { stdio: 'inherit' });
          if (result.status !== 0) process.exit(result.status ?? 1);
          EOF
