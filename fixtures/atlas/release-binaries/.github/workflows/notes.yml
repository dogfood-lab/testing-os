name: Release Notes

on:
  release:
    types: [published]

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release upload "$TAG" dist/* /tmp/out/sbom.json --clobber 2>/dev/null
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            SHA256SUMS.txt
            notes-${{ github.ref_name }}.md
