name: CI
on: [push, pull_request]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: End to end
        run: npx playwright test
      - name: End to end through pnpm
        run: pnpm playwright test --project chromium
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: go test ./...
  tox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tox -e py312
  direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tests/smoke.test.mjs
      - run: python tests/test_cli.py
