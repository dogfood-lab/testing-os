name: Pages workflow defaults
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
defaults:
  run:
    working-directory: site
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - uses: actions/deploy-pages@v4
