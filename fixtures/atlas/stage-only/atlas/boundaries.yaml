summary: ""
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: root
    globs:
      - "*"
    role: config
  - name: data
    globs:
      - data/**
    role: data
  - name: products
    globs:
      - products/**
    role: docs
  - name: scripts
    globs:
      - scripts/**
    role: code
