summary: ""
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: bin
    globs:
      - bin/**
    role: code
  - name: data
    globs:
      - data/**
    role: config
  - name: root
    globs:
      - "*"
    role: config
  - name: scripts
    globs:
      - scripts/**
    role: code
  - name: tools
    globs:
      - tools/**
    role: code
