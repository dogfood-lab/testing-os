summary: ""
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: proofs
    globs:
      - proofs/**
    role: code
  - name: registry
    globs:
      - registry/**
    role: config
  - name: root
    globs:
      - "*"
    role: config
  - name: scripts
    globs:
      - scripts/**
    role: code
