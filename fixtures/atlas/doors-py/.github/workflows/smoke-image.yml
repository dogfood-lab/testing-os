name: Image smoke

on:
  release:
    types: [created, edited]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/build-push-action@v6
        with:
          push: false
          load: true
      - name: Report
        if: always() && (needs.build.result == 'failure' || needs.build.result == 'cancelled')
        run: gh issue create --title "image smoke"
