boundaries:
  - name: scripts
    globs:
      - scripts/**
    role: code
  - name: tools
    globs:
      - tools/**
    role: code
  - name: pair
    globs:
      - a/**
      - b/**
    role: code
  - name: tests
    globs:
      - test/**
      - tests/**
    role: test
  - name: config
    globs:
      - package.json
      - README.md
    role: config
