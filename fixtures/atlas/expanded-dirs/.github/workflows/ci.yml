name: CI
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [alpha, beta]
    steps:
      - uses: actions/checkout@v4
      - name: Install
        working-directory: packages/${{ matrix.project }}
        run: npm ci
      - name: Test
        working-directory: packages/${{ matrix.project }}
        run: npm test
