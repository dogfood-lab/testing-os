summary: ""
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: root
    globs:
      - "*"
    role: config
  - name: songs
    globs:
      - songs/**
    role: data
  - name: src
    globs:
      - src/**
    role: code
  - name: tools
    globs:
      - tools/**
    role: code
