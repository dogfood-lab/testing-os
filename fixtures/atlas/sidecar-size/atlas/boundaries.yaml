boundaries:
  - name: core
    globs:
      - core/**
    role: code
  - name: root
    globs:
      - "*"
    role: config
  - name: test
    globs:
      - test/**
    role: code
  - name: users
    globs:
      - users/**
    role: code
  - name: workflows
    globs:
      - .github/**
    role: config
