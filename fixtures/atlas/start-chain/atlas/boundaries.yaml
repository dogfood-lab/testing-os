summary: ""
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: data
    globs:
      - data/**
    role: config
  - name: root
    globs:
      - "*"
    role: config
  - name: scripts
    globs:
      - scripts/**
    role: code
  - name: site
    globs:
      - site/**
    role: code
  - name: src
    globs:
      - src/**
    role: code
  - name: test
    globs:
      - test/**
    role: test
