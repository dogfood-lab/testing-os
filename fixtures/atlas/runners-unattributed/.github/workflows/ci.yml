name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: make check
      - name: Lint
        run: npm run lint
      - run: npm test
      - name: Dispatch to testing-os
        run: gh workflow run self.yml
      - name: Integration tests
        run: bash scripts/ci.sh
      - name: Headless suite
        run: godot --headless --path . --script res://tools/headless.gd
      - name: Upload suite log
        run: cp suite.log "$RUNNER_TEMP/"
