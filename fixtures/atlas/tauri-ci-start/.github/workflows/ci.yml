name: CI
on: [pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/bundle.mjs
      - run: npx vite build
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - working-directory: app/src-tauri
        run: cargo check --all-targets
      - working-directory: app/src-tauri
        run: cargo test
