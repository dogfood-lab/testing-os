[package]
name = "forge-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "forge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "forge-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
forge-engine = { path = "../../../crates/engine" }
