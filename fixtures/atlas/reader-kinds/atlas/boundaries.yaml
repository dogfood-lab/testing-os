summary: ""
boundaries:
  - name: data
    globs:
      - data/**
    role: config
  - name: docs
    globs:
      - docs/**
    role: docs
  - name: root
    globs:
      - "*"
    role: config
  - name: scripts
    globs:
      - scripts/**
    role: code
  - name: site
    globs:
      - site/**
    role: docs
  - name: src
    globs:
      - src/**
    role: code
