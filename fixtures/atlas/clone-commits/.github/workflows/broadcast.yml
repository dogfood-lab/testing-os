name: Broadcast
on:
  release:
    types: [published]
env:
  LEDGER_REPO: "acme/ledger"
jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Append the event to the ledger
        run: |
          gh repo clone "${{ env.LEDGER_REPO }}" /tmp/ledger -- --depth 1
          cd /tmp/ledger
          echo event >> events/events.jsonl
          git add events/events.jsonl
          git commit -m "event"
          git push origin HEAD
