summary: a small repository whose workflows are its doors
boundaries:
  - name: indexes
    globs:
      - indexes/**
    status: accepted
    role: config
  - name: lib
    globs:
      - lib/**
    status: accepted
    role: code
  - name: records
    globs:
      - records/**
    status: accepted
