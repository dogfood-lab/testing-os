# Sixth workflow. Justification, from docs/atlas.dispatch.md §9, verbatim:
# it replaces a workflow in every mapped repository. A push in this
# repository cannot see that a public consumer's coupling has moved, which
# is precisely the cross-repo drift case the studio's automation rule
# permits a schedule for.
name: Atlas render

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      # The run refuses to remove more than a few repository folders at once
      # (scripts/atlas-render.mjs, checkRemovals); a person who means a larger
      # removal gives its count here. Empty on the weekly schedule.
      allow_removals:
        description: 'Repository folders this run may remove, when more than the usual bound are meant'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: atlas-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.3 (node24 runtime)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/atlas-render.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_RENDER_ALLOW_REMOVALS: ${{ inputs.allow_removals }}
