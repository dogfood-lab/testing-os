# Scratch, for the AM-6 live run only (docs/atlas-buildup.spec.md); this
# branch is never merged. A door Atlas reads and nobody runs: it builds the
# site on Node 20, which astro 7.3.5 (Node >=22.12.0) refuses, so `atlas
# check` raises its D1 notice on the Node pin below.
name: AM-6 live D1 door
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Build site
        working-directory: site
        run: npm run build
