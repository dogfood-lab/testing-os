# Scratch, for the AM-6 live runs only (docs/atlas-buildup.spec.md); this
# branch is never merged. The repository is checked out into a
# subdirectory, so its root is $GITHUB_WORKSPACE/repo. The second run checks
# that annotations naming files from the repository root, with a line, land
# on the pull request's diff from here, and the control step shows whether a
# job summary renders at all, beside the one atlas check writes.
name: AM-6 live subdirectory checkout
on:
  push:
    branches: [scratch/am6-live]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.3
        with:
          path: repo
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Control line in the job summary
        run: |
          echo "AM-6 control - this line was written by a shell step." >> "$GITHUB_STEP_SUMMARY"
      - name: Install
        working-directory: repo
        run: npm ci --no-audit --no-fund
      - name: Atlas check from the subdirectory
        working-directory: repo
        run: node packages/atlas/cli.js check
